<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معمل قواعد البيانات — قاعدة بيانات المدرسة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#A4373A;--acc2:#8c2c2f;--bg:#f3f3f3;--pane:#ffffff;--line:#d4d4d4;--txt:#222;--muted:#666;--ok:#2e7d32;--warn:#c62828;--hint:#fff7d6;--sel:#dbe7f7;--key:#d4a017}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Tajawal,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
.hidden{display:none!important}
/* ===== Start screen ===== */
#start{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--acc) 0%,#5a1d1f 100%)}
.card{background:#fff;border-radius:12px;padding:28px 24px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h1{margin:0 0 4px;font-size:22px;color:var(--acc)}
.card p{margin:0 0 18px;color:var(--muted)}
.card label{display:block;margin:10px 0 4px;font-weight:600}
.card input,.card select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}
.btn{background:var(--acc);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.w{width:100%;margin-top:16px}
.teacher-link{display:block;text-align:center;margin-top:14px;color:var(--muted);background:none;border:0;text-decoration:underline}
/* ===== Story scenes ===== */
#start{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#4a2325 0%,#2a1415 55%,#160a0b 100%)}
.scene{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.paper{position:absolute;width:150px;height:200px;background:#fbf7ee;border:1px solid #d9d2c0;box-shadow:0 6px 18px rgba(0,0,0,.45);padding:10px;font-size:11px;color:#6b5b3a;transform:rotate(var(--r)) translate(0,0);animation:float var(--d) ease-in-out infinite alternate;opacity:.95}
.paper.torn{clip-path:polygon(0 0,100% 0,100% 72%,88% 80%,96% 90%,80% 100%,0 100%)}
.paper.faded{opacity:.6}
.paper .ph{font-weight:800;font-size:12px;color:#8a3a3c;border-bottom:1px solid #c9b98f;padding-bottom:4px;margin-bottom:6px}
.paper .pl{height:9px;margin:5px 0;background:repeating-linear-gradient(90deg,#d8cfb8 0 30px,transparent 30px 36px);opacity:.8}
.paper .pl.b{width:60%}
.paper .stain{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,rgba(120,80,20,.28),rgba(120,80,20,0) 70%);inset-inline-end:8px;bottom:14px}
.paper .x{position:absolute;inset-inline-start:12px;top:60px;color:#c62828;font-size:34px;font-weight:900;opacity:.5;transform:rotate(-15deg)}
@keyframes float{from{transform:rotate(var(--r)) translate(0,0)}to{transform:rotate(calc(var(--r) + 4deg)) translate(6px,-12px)}}
.card.story{position:relative;z-index:2;max-width:460px;animation:pop .5s}
.st-tag{display:inline-block;background:#fff3dc;color:#8a5a00;border:1px solid #f0d9b0;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
.st-msg{color:#333!important;line-height:1.9;background:#fff8ee;border-inline-start:4px solid #e0a040;padding:8px 10px;border-radius:6px}
.st-sig{font-size:12px;color:#777!important}
/* ending */
.overlay.endwrap{background:radial-gradient(ellipse at 50% 30%,#2b3d2e 0%,#15201a 60%,#0b120e 100%);flex-direction:column;overflow:hidden}
.endwrap .scene .paper{transition:all 1.6s cubic-bezier(.4,0,.2,1);animation:none}
.endwrap.tidy .scene .paper{opacity:0;transform:rotate(0) scale(.4)}
.tidyview{position:relative;z-index:2;opacity:0;transform:translateY(20px);transition:all .9s .9s;text-align:center;color:#fff;width:100%;max-width:760px;padding:10px}
.endwrap.tidy .tidyview{opacity:1;transform:none}
.tidyview h1{margin:6px 0 4px;color:#ffd54f;font-size:26px}
.tidyview .tbl{display:inline-block;background:#fff;color:#222;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.4);overflow:hidden;width:200px;text-align:right;font-size:12px;vertical-align:top;margin:6px}
.tidyview .tbl h5{margin:0;background:var(--acc);color:#fff;padding:5px 8px;font-size:13px}
.tidyview .tbl div{padding:3px 8px;border-bottom:1px solid #eee;display:flex;gap:4px;align-items:center}
.tidyview .tbl .k{color:var(--key)}
.tidyview .tables{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin:10px 0}
.tidyview .msg2{background:rgba(255,255,255,.12);border-inline-start:4px solid #ffd54f;padding:8px 12px;border-radius:6px;display:inline-block;max-width:560px;line-height:1.8;text-align:right;margin-top:6px}
.tidyview .chk{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:#2e7d32;color:#fff;font-size:32px;box-shadow:0 0 0 8px rgba(46,125,50,.25);animation:pop .6s 1.4s both}
.tidyview .btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
@media (max-width:700px){.tidyview .tbl{width:150px;font-size:11px}.tidyview h1{font-size:21px}}
/* ===== Intro phone + ID card ===== */
#s1w,#s2w{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:520px}
.ip{width:330px;background:#1a0c0d;border-radius:44px;padding:11px;box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 2px #5a3335,0 0 0 8px rgba(164,55,58,.18);animation:pop .5s}
.ipscr{background:linear-gradient(170deg,#8c2f33 0%,#5e1f22 55%,#3a1416 100%);border-radius:34px;overflow:hidden;position:relative;height:600px}
.ipnotch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:26px;background:#1a0c0d;border-radius:20px;z-index:5}
.ipstat{display:flex;justify-content:space-between;padding:12px 24px 0;font-size:12px;font-weight:700;color:#f3e4c9}
.iptime{text-align:center;color:#f7ead2;margin-top:34px}
.iptime b{display:block;font-size:60px;font-weight:300;line-height:1}
.iptime small{font-size:14px;opacity:.85}
.ipnotif{margin:24px 14px 0;background:#fffaf0;border-radius:20px;padding:13px 15px;box-shadow:0 12px 30px rgba(0,0,0,.45);color:#222;text-align:right;animation:slideIn .6s ease-out}
@keyframes slideIn{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.ipnotif .nh{display:flex;align-items:center;gap:8px;font-size:12px;color:#6b5b3a;margin-bottom:6px}
.ipnotif .ic{width:22px;height:22px;border-radius:6px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:none}
.ipnotif .now{margin-inline-start:auto;color:#aaa}
.ipnotif .urg{background:#fdecea;color:#b71c1c;border:1px solid #f5c6c2;font-size:11px;font-weight:800;padding:1px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;margin-bottom:6px}
.ipnotif .urg i{width:7px;height:7px;border-radius:50%;background:#c62828;animation:blink 1.2s infinite}
.ipnotif .urg.ok{background:#e8f5e9;color:#1b5e20;border-color:#c8e6c9}
@keyframes blink{50%{opacity:.3}}
.ipnotif .nt{font-weight:900;font-size:16px;margin-bottom:4px;color:#5a3c00}
.ipnotif .nb{font-size:15px;line-height:1.75;color:#333;min-height:78px}
.ipnotif .nb b{color:var(--acc)}
.ipnotif .nb.typing:after{content:"|";animation:blink .8s infinite;color:var(--acc)}
.ipq{margin:16px 14px 0;text-align:center;color:#f7ead2;font-weight:800;font-size:18px}
.ipacts{display:flex;gap:10px;margin:12px 14px 0}
.ipacts button{border:0;border-radius:16px;padding:14px;font-family:inherit;font-weight:900;font-size:17px}
.ipacts .ok{flex:2;background:#2e7d32;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.ipacts .later{flex:1;background:rgba(255,255,255,.18);color:#f7ead2;font-weight:700}
.ipacts .gold{flex:1;background:#ffd54f;color:#4a3300;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.iphome{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:110px;height:5px;background:rgba(255,255,255,.7);border-radius:3px}
.ipmeta{color:rgba(255,255,255,.6);font-size:12px}
.ip.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px) rotate(-1deg)}75%{transform:translateX(8px) rotate(1deg)}}
.idc{background:#fff;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);overflow:hidden;text-align:right;position:relative;width:100%;animation:pop .5s}
.idc .top{background:var(--acc);color:#fff;padding:10px 18px;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.idc .top small{font-weight:400;opacity:.9;font-size:12px}
.idc .main{display:flex;gap:16px;padding:16px 18px 6px;align-items:flex-start}
.idc .avatar{width:84px;height:84px;border-radius:14px;background:#fbeeee;border:2px solid #f0d9d9;display:flex;align-items:center;justify-content:center;color:var(--acc);flex:none;position:relative}
.idc .avatar svg{width:52px;height:52px}
.idc .star{position:absolute;inset-inline-end:-8px;bottom:-8px;width:28px;height:28px;border-radius:50%;background:#ffd54f;color:#7a5a00;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.idc .star svg{width:16px;height:16px}
.idc .fields{flex:1;min-width:0}
.idc .hero{font-size:13px;color:#888}
.idc .hero b{display:block;font-size:22px;color:var(--acc);border-bottom:2px dashed #e5c9c9;padding-bottom:2px;min-height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idc label{display:block;font-size:13px;color:#666;margin:12px 0 4px;font-weight:700}
.idc input{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:16px}
.idc .cls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px}
.idc .cls span{border:1.5px solid #ddd;border-radius:10px;padding:8px;text-align:center;font-weight:700;color:#444;background:#fafafa;cursor:pointer;user-select:none}
.idc .cls span.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.idc .foot{padding:12px 18px 14px;font-size:12px;color:#999;display:flex;justify-content:space-between}
.idc .okst{position:absolute;inset-inline-start:18px;top:62px;width:96px;height:96px;border-radius:50%;border:3px solid #2e7d32;color:#2e7d32;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;transform:rotate(-14deg);box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 6px #2e7d32;background:rgba(255,255,255,.85);animation:stamp .4s both}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.ipbtn{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px;font-size:18px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.ipbtn:disabled{background:#9e9e9e;box-shadow:none;opacity:1}
@media (max-width:760px){.ip{width:84%;max-width:300px;padding:9px;border-radius:36px}.ipscr{height:520px;border-radius:28px}.iptime{margin-top:26px}.iptime b{font-size:48px}.ipnotif{margin-top:16px}.ipnotif .nb{font-size:14px}#start .paper{width:96px;height:120px;padding:6px}#start .paper .ph{font-size:9px}}
/* ===== Ending v2 ===== */
.endv{position:relative;z-index:2;opacity:0;transform:translateY(20px);transition:all .9s .9s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;max-width:520px;padding:10px}
.endwrap.tidy .endv{opacity:1;transform:none}
.endtab{width:100%;text-align:center}
.endtag{display:inline-block;background:#2e7d32;color:#fff;font-weight:900;font-size:14px;padding:5px 16px;border-radius:20px;box-shadow:0 6px 16px rgba(0,0,0,.4);margin-bottom:10px}
.endtab .tb{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.5);margin:0 auto;width:380px;max-width:100%;position:relative;z-index:2;text-align:right;color:#222}
.endtab .tb .h{background:var(--acc);color:#fff;font-weight:800;font-size:15px;padding:6px 12px}
.endtab .tb table{width:100%;border-collapse:collapse;font-size:14px}
.endtab .tb th{background:#f3e9e9;color:#6b2a2c;font-weight:800;padding:4px 8px;text-align:right}
.endtab .tb td{padding:4px 8px;border-top:1px solid #eee}
.endtab .tb td:first-child{color:var(--acc);font-weight:800;width:28px}
.endtab .con{position:relative;z-index:1;width:3px;height:30px;background:#ffd54f;margin:-4px auto;box-shadow:0 0 8px #ffd54f}
.endtab .con:before,.endtab .con:after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:#ffd54f}
.endtab .con:before{top:-5px}.endtab .con:after{bottom:-5px}
.endtab .con span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#1a2b1d;color:#ffd54f;font-size:11px;font-weight:800;padding:1px 8px;border-radius:8px;border:1px solid #ffd54f;white-space:nowrap}
.ach{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.ach span{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:700}
.ach span svg{width:15px;height:15px}
.ach span i{font-style:normal;color:#8ce99a;font-weight:900}
.endnext{display:block;width:380px;max-width:92%;margin:12px auto 0;background:#ffd54f;color:#4a3300;border:0;border-radius:14px;padding:13px;font-weight:900;font-size:17px}
.endph{display:none;width:100%;text-align:center}
.endv.p2 .endtab{display:none}.endv.p2 .endph{display:block}
.endph .ip{text-align:right}
.endph .ip{width:300px;border-radius:40px;padding:10px;box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 2px #5a3335,0 0 0 8px rgba(46,125,50,.22)}
.endph .ipscr{height:540px;border-radius:31px}
.endph .iptime{margin-top:26px}.endph .iptime b{font-size:50px}
.endph .ipnotif{margin-top:20px;animation:none}
.endph .ipacts{margin-top:16px}
.endph .ipacts button{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.endph .ipacts svg{width:22px;height:22px}
.endnote{color:rgba(255,255,255,.6);font-size:12px;text-align:center;margin-top:8px}
@media (max-width:760px){.endv{padding:6px}.endtab .tb{width:92%}.endtab .tb table{font-size:11px}.endph .ip{width:84%;max-width:290px}.endph .ipscr{height:470px}.endph .iptime b{font-size:40px}}
/* ===== Missions map ===== */
.overlay.mapwrap{background:radial-gradient(ellipse at 50% 30%,#4a2325 0%,#2a1415 55%,#160a0b 100%);padding:12px;align-items:center;overflow:auto}
.mp{position:relative;z-index:2;width:100%;max-width:520px;background:#fff;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);overflow:hidden;text-align:right;animation:pop .5s}
.mp .top{background:var(--acc);color:#fff;padding:12px 20px;font-weight:800;font-size:17px;line-height:1.5}
.mp .top small{display:block;font-weight:400;opacity:.9;font-size:12.5px}
.mp .h2{padding:12px 20px 4px;font-size:16px;font-weight:900;color:#444}
.mp .list{padding:4px 16px 6px;display:flex;flex-direction:column;gap:7px}
.mp .ms{display:flex;align-items:center;gap:12px;border:1.5px solid #e8e0e0;border-radius:12px;padding:8px 12px;background:#fafafa}
.mp .ms.on{border-color:var(--acc);background:#fff;box-shadow:0 0 0 4px rgba(164,55,58,.12)}
.mp .ms .c{width:40px;height:40px;border-radius:50%;background:#eee;color:#999;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.mp .ms.on .c{background:var(--acc);color:#fff}
.mp .ms .c .lk{position:absolute;inset-inline-end:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;color:#999}
.mp .ms .t{flex:1;font-size:16px;font-weight:800;color:#222}
.mp .ms .t small{color:#999;font-weight:700;font-size:13px}
.mp .ms.on .t small{color:var(--acc)}
.mp .pt{display:inline-flex;align-items:center;gap:5px;background:#fff8dc;color:#8a5a00;border:1px solid #ffd54f;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:900;white-space:nowrap}
.mp .pt svg{color:#e0a800}
.mp .fin{margin:4px 16px 0;background:#fff8dc;border:1.5px solid #ffd54f;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:12px}
.mp .fin .c{width:40px;height:40px;border-radius:50%;background:#ffd54f;color:#5a3c00;display:flex;align-items:center;justify-content:center;flex:none}
.mp .fin .t{font-weight:900;font-size:15px;color:#5a3c00}
.mp .foot{padding:12px 16px 16px}
.mp .foot .btn{display:block;width:100%;border-radius:12px;padding:13px;font-size:17px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.25)}
@media (max-width:760px){.mp .top{padding:10px 16px;font-size:16px}.mp .h2{padding:8px 16px 2px;font-size:15px}.mp .list{gap:5px;padding:4px 12px}.mp .ms{padding:6px 10px;gap:10px}.mp .ms .c{width:34px;height:34px}.mp .ms .t{font-size:14.5px}.mp .ms .t small{font-size:12px}.mp .pt{font-size:12px;padding:2px 8px}.mp .fin{margin:4px 12px 0;padding:6px 10px}.mp .fin .c{width:34px;height:34px}.mp .fin .t{font-size:13.5px}.mp .foot{padding:10px 12px 12px}.mp .foot .btn{padding:11px;font-size:16px}}
/* ===== Lesson cards ===== */
.overlay.lessonwrap{background:rgba(20,8,8,.75);padding:12px;align-items:center;overflow:auto}
.lc{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 14px 40px rgba(0,0,0,.45);overflow:hidden;font-size:15px;line-height:1.8;color:#222;max-height:96vh;display:flex;flex-direction:column}
.lh{background:var(--acc);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;flex:none}
.lh .num{background:#fff;color:var(--acc);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800}
.lh .ttl{margin-inline-start:auto;opacity:.95}
.panes{display:block;overflow:auto;flex:1}
.pane{display:none;min-width:0}
.lc:not(.p2) .pane.pa{display:block}
.lc.p2 .pane.pb{display:block}
.lsec{padding:10px 16px 12px;border-bottom:1px solid #f0e8e8}
.sh{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;margin-bottom:6px;color:#444}
.sh.c1{color:#1e88e5}.sh.c3{color:var(--acc)}.sh.c4{color:#b08400}
.fig{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:6px;margin:0 0 10px;display:flex;justify-content:center}
.lfig{width:100%;height:auto;max-width:470px;font-family:inherit}
.lfig .la{opacity:0;animation:lapop .5s forwards}
.lfig .l1{animation-delay:.3s}.lfig .l2{animation-delay:.9s}.lfig .l3{animation-delay:1.5s}.lfig .l4{animation-delay:2.1s}
@keyframes lapop{to{opacity:1}}
table.def{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:16px;table-layout:auto}
table.def th{font-size:13.5px;color:#777;font-weight:700;padding:0 8px 2px;text-align:right}
table.def td{padding:7px 10px;vertical-align:middle;height:34px}
table.def td:first-child{border-radius:0 8px 8px 0;font-weight:800;width:1%;color:#fff;white-space:nowrap}
table.def td:first-child span{display:inline-flex;align-items:center;gap:6px}
table.def td:nth-child(2){color:#222}
table.def td:last-child{border-radius:8px 0 0 8px;width:1%;color:#333;border-inline-start:1px dashed rgba(0,0,0,.18);white-space:nowrap}
table.def td:last-child b{color:#111}
.t1 td:first-child{background:#1e88e5}.t1 td{background:#e8f2fd}
.t2 td:first-child{background:#2e7d32}.t2 td{background:#e6f4e8}

.steps2 li .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.steps2.compact li{padding:5px 10px;margin:4px 0;font-size:14px}
.steps2.compact li .n{width:22px;height:22px;font-size:12px}

.lbtn{display:inline-flex;align-items:center;gap:4px;background:var(--acc);color:#fff;border-radius:6px;padding:1px 9px;font-size:.93em;font-weight:700;vertical-align:middle;margin:0 2px}
.lbtn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.lsec.tip{background:#fff8dc}

.lc .btn.startb,.lc .btn.nextb{display:block;margin:14px 16px 16px;border-radius:10px;padding:12px;font-size:17px;font-weight:800;width:calc(100% - 32px)}
.lc .btn.nextb{display:block}
.dots{display:flex;justify-content:center;gap:6px;padding:4px;flex:none}
.dots span{width:8px;height:8px;border-radius:50%;background:#ddd}.dots span.on{background:var(--acc)}

  .lsec{padding:6px 12px 8px}.sh{margin-bottom:3px}

  .lsec.tip .rule{margin:1px 0}.lsec.tip .rule b{padding:0 8px;min-width:80px}
  .lc .btn.startb{margin:8px 12px 10px;padding:10px;font-size:16px;width:calc(100% - 24px)}
}
/* ===== App shell ===== */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.title{background:var(--acc);color:#fff;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:14px}
.title .logo{background:#fff;color:var(--acc);font-weight:800;border-radius:4px;padding:1px 6px}
.title .who{margin-inline-start:auto;opacity:.95}
.ribbon-tabs{background:var(--acc);display:flex;gap:2px;padding:0 8px}
.ribbon-tabs span{color:#fff;padding:6px 12px;font-size:14px;border-radius:4px 4px 0 0}
.ribbon-tabs span.on{background:#fff;color:var(--txt)}
.ribbon{background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:46px}
.ribbon .grp{display:flex;gap:6px;align-items:center;padding-inline-end:10px;border-inline-end:1px solid var(--line)}
.ribbon .grp:last-child{border:0}
.rb{background:#fff;border:1px solid transparent;border-radius:4px;padding:4px 8px;display:flex;gap:4px;align-items:center;font-size:14px}
.rb:hover{border-color:var(--line);background:#f7f7f7}
.rb.run{color:var(--warn);font-weight:800}
.progress{background:#fafafa;border-bottom:1px solid var(--line);padding:6px 10px;display:flex;gap:6px;align-items:center;font-size:13px;overflow-x:auto}
.progress .st{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:14px;border:1px solid var(--line);white-space:nowrap;background:#fff}
.progress .st{cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
.progress .st:hover{background:#fbeeee;border-color:var(--acc);color:var(--acc);transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.progress .st.lock{opacity:.45;cursor:not-allowed}
.progress .st.lock:hover{background:#fff;border-color:var(--line);color:inherit;transform:none;box-shadow:none}
.progress .st.done{background:#e6f4ea;border-color:#9ccc9c;color:var(--ok)}
.progress .st.cur{border-color:var(--acc);color:var(--acc);font-weight:700}
.progress .pts{margin-inline-start:auto;font-weight:700;color:var(--acc);white-space:nowrap}
.main{flex:1;display:flex;min-height:0}
.nav{width:230px;background:var(--pane);border-inline-end:1px solid var(--line);overflow:auto;flex-shrink:0}
.nav h3{margin:0;padding:8px 10px;font-size:13px;background:#efefef;border-bottom:1px solid var(--line);color:#444}
.nav .sec{padding:4px 0}
.nav .sec h4{margin:0;padding:6px 10px;font-size:13px;color:var(--acc);display:flex;gap:6px;align-items:center}
.nav .obj{padding:5px 22px;font-size:14px;display:flex;gap:6px;align-items:center;color:#333;cursor:pointer}
.nav .obj:hover{background:#fbeeee;color:var(--acc)}
.nav .obj.lock:hover{background:none;color:#aaa}
.rb,.btn,.tabs2 button,.chal button{cursor:pointer}
.rb:hover,.tabs2 button:hover,.chal button:hover{box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn:hover{filter:brightness(1.08);box-shadow:0 2px 6px rgba(0,0,0,.18)}
#mnav button:hover{background:#fbeeee;color:var(--acc)}
.nav .obj.on{background:var(--sel)}
.nav .obj.lock{color:#aaa;cursor:not-allowed}
.work{flex:1;display:flex;flex-direction:column;min-width:0}
.doctabs{display:flex;background:#eaeaea;border-bottom:1px solid var(--line);overflow-x:auto}
.doctabs span{padding:7px 14px;font-size:14px;border-inline-end:1px solid var(--line);white-space:nowrap;cursor:pointer}
.doctabs span.on{background:#fff;font-weight:700;border-bottom:2px solid var(--acc)}
.view{flex:1;overflow:auto;padding:14px;background:#fff}
.status{background:#eee;border-top:1px solid var(--line);padding:4px 10px;font-size:13px;color:#444;display:flex;gap:10px}
.status .right{margin-inline-start:auto}
/* ===== Station blocks ===== */
.task{background:#fff8ee;border:1px solid #f0d9b0;border-inline-start:4px solid #e0a040;border-radius:6px;padding:10px 12px;margin-bottom:12px}
.task b{color:#8a5a00}
.tabs2{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:#f7f7f7;padding:6px 12px;border-radius:6px 6px 0 0}
.tabs2 button.on{background:#fff;border-bottom-color:#fff;font-weight:700;color:var(--acc)}
table.grid{border-collapse:collapse;width:100%;background:#fff;font-size:14px}
table.grid th{background:#f3f3f3;border:1px solid var(--line);padding:6px 8px;font-weight:600;text-align:right;white-space:nowrap}
table.grid td{border:1px solid var(--line);padding:4px 8px;vertical-align:middle}
table.grid td input,table.grid td select{width:100%;border:1px solid transparent;padding:5px 6px;border-radius:3px;background:transparent;min-width:90px}
table.grid td input:focus,table.grid td select:focus{border-color:var(--acc);outline:0;background:#fff}
table.grid tr.newrow td{background:#fbfbfb}
table.grid tr.newrow td:first-child{color:#999;text-align:center}
.keycell{width:36px;text-align:center;cursor:pointer;font-size:18px;user-select:none}
.keycell{filter:grayscale(1);opacity:.35}
.keycell.on{filter:none;opacity:1}
.props{margin-top:10px;border:1px solid var(--line);background:#fafafa;padding:8px 10px;font-size:13px;color:#555}
.wrap{overflow-x:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.msg{padding:8px 10px;border-radius:6px;margin:8px 0;font-size:14px}
.msg.ok{background:#e6f4ea;color:var(--ok)}
.msg.err{background:#fdecea;color:var(--warn)}
.datacard{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:10px 0;background:#fafcff}
.datacard h4{margin:0 0 6px;font-size:14px;color:#345}
.datacard table{font-size:13px}
.datacard tr{cursor:pointer}
.datacard tr:hover td{background:#eef4ff}
.datacard tr.got td{color:#999;text-decoration:line-through}
.mcq{border:1px solid var(--line);border-radius:6px;padding:10px;margin:10px 0}
.mcq p{margin:0 0 6px;font-weight:600}
.mcq label{display:block;padding:5px 0;cursor:pointer}
/* relationships */
.relcanvas{position:relative;min-height:380px;background:#fff;border:1px solid var(--line);background-image:linear-gradient(#f4f4f4 1px,transparent 1px),linear-gradient(90deg,#f4f4f4 1px,transparent 1px);background-size:20px 20px;border-radius:6px;overflow:hidden}
.relcanvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tbox{position:absolute;width:150px;background:#fff;border:1px solid #999;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.15);font-size:13px}
.tbox h5{margin:0;background:var(--acc);color:#fff;padding:5px 8px;font-size:13px;border-radius:4px 4px 0 0}
.tbox div{padding:4px 8px;border-bottom:1px solid #eee;cursor:pointer;display:flex;gap:4px;align-items:center}
.tbox div:hover{background:#f0f4ff}
.tbox div.sel{background:var(--sel);outline:2px solid var(--acc)}
.tbox div .k{color:var(--key)}
/* QBE */
.qbe-top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qbe-top .tbox{position:static;width:140px}
.qbe{display:flex;gap:8px;flex-wrap:wrap}
.qcol{border:1px solid var(--line);border-radius:6px;padding:8px;width:190px;background:#fafafa;font-size:13px}
.qcol label{display:block;color:#555;margin:6px 0 2px}
.qcol select,.qcol input{width:100%;padding:5px;border:1px solid var(--line);border-radius:4px;background:#fff}
.qcol .chk{display:flex;gap:6px;align-items:center;margin-top:6px}
.chal{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chal button{border:1px solid var(--line);background:#fff;padding:5px 10px;border-radius:14px;font-size:13px}
.chal button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chal button.done{background:#e6f4ea;border-color:#9ccc9c;color:var(--ok)}
/* form / report preview */
.formprev{border:1px solid #bbb;background:#f0f0f0;padding:0;border-radius:4px;max-width:420px}
.formprev .fh{background:var(--acc);color:#fff;padding:6px 10px;font-weight:700}
.formprev .fb{padding:10px}
.formprev .fr{display:flex;align-items:center;gap:8px;margin:6px 0}
.formprev .fr label{width:110px;color:#333}
.formprev .fr input,.formprev .fr select{flex:1;padding:5px;border:1px solid #bbb;background:#fff}
.report{border:1px solid #ccc;padding:14px;background:#fff;max-width:560px;font-size:14px}
.report h3{margin:0 0 10px;color:var(--acc);border-bottom:2px solid var(--acc);padding-bottom:4px}
.report .g{font-weight:700;background:#f3f3f3;padding:4px 6px;margin-top:8px}
.report .r{display:flex;gap:16px;padding:2px 12px;border-bottom:1px dotted #ddd}
.steps{display:flex;gap:4px;margin-bottom:8px;font-size:13px}
.steps span{padding:3px 8px;border-radius:12px;background:#eee}
.steps span.on{background:var(--acc);color:#fff}
/* dialogs */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:#fff;border:1px solid #888;border-radius:8px;min-width:280px;max-width:500px;max-height:92vh;overflow:auto;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:14px}
.dlg .dh{background:#f0f0f0;border-bottom:1px solid #ccc;padding:7px 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.dlg .db{padding:14px 12px;display:flex;gap:10px;align-items:flex-start;line-height:1.6;white-space:pre-line}
.dlg .ic{font-size:28px;line-height:1}
.dlg .ic:empty{display:none}
.dlg .df{padding:8px 12px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dlg .df .btn{padding:6px 14px}
/* hint bubble */
#hint{position:fixed;bottom:16px;inset-inline-start:16px;max-width:340px;background:var(--hint);border:1px solid #e8d48b;border-radius:10px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:40;font-size:14px;display:flex;gap:8px;align-items:flex-start;animation:pop .25s}
#hint .ic{font-size:20px}
#hint button{background:none;border:0;color:#8a6d00;font-weight:700;margin-inline-start:auto}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.hintlist div{padding:6px 0;border-bottom:1px dotted #ddd}
/* story / badges / certificate */
.doctabs .mission{padding:7px 14px;font-size:13px;color:#8a5a00;white-space:nowrap}
.cbadges{display:flex;gap:8px;justify-content:center;font-size:26px;margin:10px 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100}
.certwrap{background:rgba(0,0,0,.6);flex-direction:column;gap:10px;overflow:auto}
.cert{background:#fffdf7;border:10px double #b8962e;padding:8px;width:100%;max-width:720px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.cert .cb{border:2px solid #b8962e;padding:22px 20px;text-align:center;background:radial-gradient(circle at 50% 0,#fff 0,#fffdf7 60%)}
.cert .ch{color:#b8962e;margin-bottom:2px}
.cert .cbody{font-size:14px;color:#333;line-height:1.9;max-width:560px;margin:8px auto 10px}
.cbadges2{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.cbadges2 div{display:flex;flex-direction:column;align-items:center;gap:2px;width:84px}
.cbadges2 .bi{width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid #d9c68a;color:#b8962e;display:flex;align-items:center;justify-content:center}
.cbadges2 small{font-size:10.5px;color:#666;line-height:1.3}
.cert .ct{font-size:30px;font-weight:800;color:#8c6d1f;letter-spacing:1px}
.cert .cs{color:#666;margin-bottom:14px;font-size:14px}
.cert .cp{font-size:15px;color:#333;margin:4px 0}
.cert .cn{font-size:30px;font-weight:800;color:var(--acc);margin:6px 0;border-bottom:2px solid #b8962e;display:inline-block;padding:0 24px 4px}
.cert .cl{font-size:19px;font-weight:700;color:#8c6d1f;margin:8px 0}
.cert .cm{font-size:13px;color:#555;margin-top:6px}
.cert .csig{display:flex;justify-content:space-around;margin-top:22px;font-size:13px;color:#444;gap:10px}
.cert .csig .line{width:150px;border-top:1px solid #777;margin:0 auto 6px}
.cert .cc{font-family:monospace;font-size:12px;color:#888;margin-top:14px}
.certbtns{display:flex;gap:8px}
@media print{ body *{visibility:hidden} .certwrap,.certwrap *{visibility:visible} .certwrap{position:fixed;inset:0;background:#fff;padding:0;align-items:flex-start} .certbtns{display:none!important} .cert{box-shadow:none;max-width:none} }
@media (max-width:600px){ .cert .cn{font-size:24px} .cert .ct{font-size:24px} .cert .cb{padding:14px 10px} .cert .csig .line{width:90px} }
.donebar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#e6f4ea;border:1px solid #9ccc9c;color:#1e5c2a;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.nextbtn{margin-inline-start:8px;padding:4px 12px;font-size:13px}
.chk-list div{padding:5px 0;border-bottom:1px dotted #e5e5e5}
.chk-list .ok{color:#2e7d32}
#mnav button.nx{color:var(--acc);font-weight:700}
.ic-svg{display:inline-flex;vertical-align:-.17em;line-height:1}
.ic-svg svg{width:1.1em;height:1.1em}
.emo{display:inline}
/* task card */
.tc{background:#fff;border:1px solid #eadfc8;border-radius:10px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tc .tch{background:linear-gradient(90deg,#fff3dc,#fff9ee);padding:10px 12px;display:flex;gap:10px;align-items:center}
.tc .tcn{background:var(--acc);color:#fff;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.tc h4{margin:0;font-size:15px;color:#5a3c00}
.tc .tcb{padding:8px 12px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:14px}
.tc .goal{grid-column:1/-1;background:#eef7f0;color:#1e5c2a;border-radius:6px;padding:6px 9px;font-weight:600}
.tc ol{margin:0;padding-inline-start:20px;line-height:1.75}
.tc .tip{font-size:13px;color:#666;background:#fafafa;border-radius:6px;padding:6px 9px;align-self:start}
@media (max-width:700px){.tc .tcb{grid-template-columns:1fr}}
/* structured dialogs */
.dlg .dh.err{background:#fdecea;color:#b71c1c;border-bottom-color:#f5c6c2}
.dlg .lbl{font-size:12px;color:#888;font-weight:700;margin:8px 0 2px;letter-spacing:.2px}
.dlg .lbl:first-child{margin-top:0}
.dlg .fix{background:#e9f3ff;border-inline-start:3px solid #1e88e5;padding:6px 9px;border-radius:4px}
.dlg .where{font-size:12px;color:#b71c1c;margin-top:8px}
.dlg .db>div{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.mini{background:#f7f7f9;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.5}
.mini b{display:block;color:var(--acc);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 9px;font-size:12px}
.stats{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.stat{background:#f7f7f9;border-radius:8px;padding:6px 12px;font-size:13px;min-width:80px}
.stat b{display:block;font-size:17px;color:var(--acc)}
.msgbox{background:#fff8ee;border-inline-start:4px solid #e0a040;padding:8px 10px;border-radius:6px;margin-bottom:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
/* error highlight */
.bad{outline:2px solid #c62828!important;outline-offset:1px;background:#fdecea!important;animation:shake .4s;border-radius:4px}
.tbox div.bad,.tabs2 button.bad,.mcq label.bad{background:#fdecea!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* teacher */
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th,.tt td{border:1px solid var(--line);padding:5px 8px;text-align:center}
.tt th{background:#f3f3f3}
.tt td.n{text-align:right;font-weight:600}
.tt .y{color:var(--ok);font-weight:700}.tt .x{color:#bbb}
/* badge */
.badge{text-align:center;padding:20px}
.badge .big{font-size:64px}
.badge h2{color:var(--acc);margin:6px 0}
.badge .code{font-family:monospace;font-size:22px;background:#f3f3f3;padding:6px 12px;border-radius:6px;display:inline-block;margin-top:8px;letter-spacing:2px}
/* ===== Mobile ===== */
@media (max-width:900px){
  .nav{display:none}
  .ribbon-tabs{display:none}
  .ribbon{overflow-x:auto;flex-wrap:nowrap}
  .view{padding:10px}
  .qcol{width:100%}
  .relcanvas{min-height:480px}
  .tbox{width:120px;font-size:12px}
  #tb_subjects{top:250px!important;margin-left:-60px!important}

function s1check(){
  var wrong=[];
  ["students","teachers","subjects"].forEach(function(k){
    SCHEMA[k].fields.forEach(function(f){ var t=S.s1.types[k+"."+f.n]||""; if(t!==f.t) wrong.push(SCHEMA[k].title+" › "+f.n+(t?" (اخترتِ: "+t+")":" (لم يُحدد)")); });
    var pk=SCHEMA[k].fields.filter(function(f){return f.pk;})[0].n;
    if(S.s1.pk[k]!==pk) wrong.push(SCHEMA[k].title+" › المفتاح الأساسي"+(S.s1.pk[k]?" (اخترتِ: "+S.s1.pk[k]+")":" غير محدد"));
  });
  var m=$("s1msg");
  if(wrong.length){ err(1); setStatus(null,"أخطاء هذه المحطة: "+S.errs[1]);
    // تظليل مكان الخطأ: خلايا الجدول الحالي + تبويبات الجداول الأخرى
    var els=[]; var rows=document.querySelectorAll("#s1grid table tr"); var tabBtns=document.querySelectorAll(".tabs2 button");
    ["students","teachers","subjects"].forEach(function(k,ti){
      var bad=false;
      SCHEMA[k].fields.forEach(function(f,i){ var t=S.s1.types[k+"."+f.n]||""; if(t!==f.t){ bad=true; if(k===s1tab&&rows[i+1]) els.push(rows[i+1].children[2]); } });
      var pk=SCHEMA[k].fields.filter(function(f){return f.pk;})[0].n;
      if(S.s1.pk[k]!==pk){ bad=true; if(k===s1tab) rows.forEach(function(r,i){ if(i>0&&r.children[0].classList.contains("keycell")) els.push(r.children[0]); }); }
      if(bad&&k!==s1tab&&tabBtns[ti]) els.push(tabBtns[ti]);
    });

    accessError("التصميم غير مكتمل:\n• "+wrong.slice(0,3).join("\n• ")+(wrong.length>3?"\n… و"+(wrong.length-3)+" أخرى":""),hk,els,"افتحي الجدول المظلل، صحّحي نوع البيانات أو حددي المفتاح 🔑، ثم اضغطي «تحقق» مرة أخرى.");
    m.innerHTML="";

}

  +[["a","لأن الاسم طويل"],["b","لأن الاسم قد يتكرر بين طالبتين، والرقم فريد"],["c","لأن الأرقام أسهل في الكتابة"]].map(function(o){return '<label><input type="radio" name="s1q" value="'+o[0]+'"> '+o[1]+'</label>';}).join("")

function s2fill(i){ var r=s2src(s2tab)[i]; S2COLS[s2tab].forEach(function(c){ $("s2_"+c[0]).value=r[c[0]]; }); }
function s2validate(vals,quiet){
  var cols=S2COLS[s2tab];
  for(var i=0;i<cols.length;i++){ var k=cols[i][0], val=String(vals[k]||"").trim();
    if(!val){ if(!quiet) accessError("الحقل «"+cols[i][1]+"» مطلوب ولا يمكن تركه فارغًا.",null,$("s2_"+k),"اكتبي قيمة في الحقل المظلل."); return false; }
    if(k==="dob" && isNaN(Date.parse(val))){ if(!quiet) accessError("القيمة التي أدخلتِها لا تتطابق مع نوع البيانات «تاريخ/وقت» للحقل «تاريخ الميلاد».","type",$("s2_"+k),"اختاري التاريخ من المنتقي أو اكتبيه بصيغة سنة-شهر-يوم."); return false; }
    if((k==="g"||k==="sid"||k==="tid") && !/^\d+$/.test(val)){ if(!quiet) accessError("القيمة «"+val+"» لا تتطابق مع نوع البيانات «رقم» للحقل «"+cols[i][1]+"».","type",$("s2_"+k),"اكتبي رقمًا فقط بدون حروف أو رموز."); return false; }
    if(k==="sid" && !S.s2.rows.students[+val-1]){ if(!quiet) accessError("لا يمكنك إضافة السجل أو تغييره لأن السجل المرتبط مطلوب في الجدول «الطالبات» (لا توجد طالبة رقم "+val+").","ri",$("s2_"+k),"استخدمي رقم طالبة موجودة (1–3)، أو أضيفي الطالبة أولًا في جدول الطالبات."); return false; }
    if(k==="tid" && !S.s2.rows.teachers[+val-1]){ if(!quiet) accessError("لا يمكنك إضافة السجل أو تغييره لأن السجل المرتبط مطلوب في الجدول «المعلمات» (لا توجد معلمة رقم "+val+").","ri",$("s2_"+k),"استخدمي رقم معلمة موجودة (1–3)، أو أضيفي المعلمة أولًا في جدول المعلمات."); return false; }
    if(k==="g" && (+val<70||+val>100)){ if(!quiet) accessError("الدرجة يجب أن تكون بين 70 و100 (قاعدة التحقق من الصحة).",null,$("s2_"+k),"اكتبي درجة من 70 إلى 100."); return false; }
  }
  return true;
}
function s2add(){
  var vals={}; S2COLS[s2tab].forEach(function(c){ vals[c[0]]=$("s2_"+c[0]).value.trim(); });
  if(!s2validate(vals)){ err(2); setStatus(null,"أخطاء هذه المحطة: "+S.errs[2]); return; }
  if(s2tab==="subjects"){ vals.sid=+vals.sid; vals.tid=+vals.tid; vals.g=+vals.g; }
  S.s2.rows[s2tab].push(vals); save();
  if(S.s2.rows[s2tab].length===1) hint(s2tab==="students"?"rec":"auto");
  render(); s2checkDone();
}
function s2del(i){ S.s2.rows[s2tab].splice(i,1); save(); render(); }
function s2test(n){

var REL_TABLES=[{k:"students",x:"right:20px",y:40},{k:"subjects",x:"left:50%;margin-left:-75px",y:120},{k:"teachers",x:"left:20px",y:40}];

function parseCrit(c){
  c=String(c||"").trim().replace(/^["']|["']$/g,"").replace(/^=/,"").trim(); if(!c) return null;
  var m=c.match(/^(>=|<=|<>|>|<)\s*(.+)$/);
  if(m){ var n=parseFloat(m[2]); return function(v){ v=parseFloat(v); return {">":v>n,"<":v<n,">=":v>=n,"<=":v<=n,"<>":v!==n}[m[1]]; }; }
  return function(v){ return String(v).trim()===c; };
}
function runQuery(){
  if(S.cur!==4) return;

  var rows=joined().filter(function(r){ return cols.every(function(c){ return !c.crit||c.crit(r[c.f]); }); });
  var sorts=cols.filter(function(c){return c.sort;});
  if(sorts.length) rows.sort(function(a,b){ for(var i=0;i<sorts.length;i++){ var k=sorts[i].f, x=a[k], y=b[k]; var cmp=(typeof x==="number")?x-y:String(x).localeCompare(String(y),"ar"); if(cmp) return sorts[i].sort==="desc"?-cmp:cmp; } return 0; });
  var shown=cols.filter(function(c){return c.show;});
  var seen={}; rows=rows.filter(function(r){ var k=shown.map(function(c){return r[c.f];}).join("|"); if(seen[k]) return false; seen[k]=true; return true; }); // قيم فريدة

  var ch=CHAL[s4cur], shownKeys=shown.map(function(c){return c.f;});
  var ok=ch.need.every(function(k){return shownKeys.indexOf(k)>=0;});
  if(ok){ var exp=ch.exp(), got=rows.map(function(r){var o={};ch.need.forEach(function(k){o[k]=r[k];});return JSON.stringify(o);}); var ex=exp.map(function(o){return JSON.stringify(o);});
    if(ch.ordered) ok=got.join("|")===ex.join("|"); else ok=got.length===ex.length&&ex.every(function(e){return got.indexOf(e)>=0;}); }
  if(ok){ S.s4.done[s4cur]=true; save(); html='<div class="msg ok">نتيجة صحيحة ✔ التحدي '+(s4cur+1)+' مكتمل.</div>'+html; renderProgress();
    if(Object.keys(S.s4.done).length===CHAL.length){ $("s4res").innerHTML=html; complete(4); return; } }
  else { err(4); setStatus(null,"أخطاء هذه المحطة: "+S.errs[4]); html='<div class="msg err">النتيجة لا تطابق المطلوب في التحدي '+(s4cur+1)+'.</div>'+html;
    var badCols=[]; for(var j=0;j<4;j++){ var fj=$("qf"+j).value; if(fj&&ch.need.indexOf(fj)>=0&&!$("qv"+j).checked) badCols.push($("qv"+j).parentElement); }
    var missing=ch.need.filter(function(k){return shownKeys.indexOf(k)<0;}).map(function(k){return QF.filter(function(q){return q[1]===k;})[0][0];});
    var msg=missing.length?"ينقص الاستعلام الحقل: "+missing.join("، ")+".":"الحقول صحيحة لكن النتيجة مختلفة: راجعي المعايير والترتيب في الأعمدة المظللة.";
    if(!missing.length) for(var j=0;j<4;j++){ if($("qf"+j).value) badCols.push(document.querySelectorAll(".qcol")[j]); }
    accessError("النتيجة لا تطابق التحدي "+(s4cur+1)+". "+msg,null,badCols.length?badCols:document.querySelector(".qbe"),missing.length?"أضيفي الحقل الناقص في عمود فارغ وتأكدي أن «إظهار» مفعّل.":"قارني الأعمدة المظللة مع «تلميح التحدي»، ثم اضغطي تشغيل مرة أخرى."); }

function miniTable(x,y,title,cols,rows,hl){
  var w=cols.length*62+6, s='<g transform="translate('+x+','+y+')"><rect x="0" y="0" width="'+w+'" height="'+(26+rows.length*22)+'" rx="5" fill="#fff" stroke="#999"/><rect x="0" y="0" width="'+w+'" height="22" fill="#A4373A"/><text x="'+(w/2)+'" y="15" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">'+title+'</text>';
  cols.forEach(function(c,i){ var cx=w-3-i*62-31; s+='<text x="'+cx+'" y="36" font-size="10.5" fill="#8a3a3c" text-anchor="middle" font-weight="700">'+c+'</text>'; if(hl===i) s+='<rect x="'+(w-3-i*62-62)+'" y="24" width="62" height="'+(rows.length*22)+'" fill="#fff3c4" opacity=".7"/>'; });
  rows.forEach(function(r,ri){ r.forEach(function(v,i){ var cx=w-3-i*62-31; s+='<text x="'+cx+'" y="'+(52+ri*20)+'" font-size="11" fill="#333" text-anchor="middle">'+v+'</text>'; }); });
  return s+'</g>';
}

function lessonHTML(n){
  var L=LESSONS[n];
  var defs='<table class="def"><tr><th>المصطلح</th><th>المعنى</th><th>مثال</th></tr>'+L.defs.map(function(d){return '<tr class="'+d[0]+'"><td><span>'+lic(d[1])+esc(d[2])+'</span></td><td>'+esc(d[3])+'</td><td>'+d[4]+'</td></tr>';}).join("")+'</table>';
  var tips=L.tips.map(function(t){return '<div class="rule"><i>'+esc(t[0])+'</i><b>'+esc(t[1])+'</b></div>';}).join("");
  return '<div class="lc"><div class="lh"><span class="num">'+n+'</span><span>المهمة '+n+' من 6</span><span class="ttl">'+esc(L.title)+'</span></div>'
    +'<div class="panes"><div class="pane pa"><div class="lsec"><div class="sh c1">'+lic("book")+'المعنى</div><div class="fig">'+L.fig()+'</div>'+defs+'</div><button class="btn nextb" onclick="lessonPane(this,2)">التالي</button></div>'
    +'<div class="pane pb"><div class="lsec"><div class="goalbox"><div class="gt">'+lic("target",22)+'مهمتك</div><p>'+L.goal+'</p></div></div>'
    +'<div class="lsec"><div class="sh c3">'+lic("list")+'الخطوات</div><ol class="steps2">'+L.steps.map(function(s,i){return '<li><span class="n">'+(i+1)+'</span><div>'+s+'</div></li>';}).join("")+'</ol></div>'
    +'<div class="lsec tip"><div class="sh c4">'+lic("bulb")+esc(L.tipTitle)+'</div>'+tips+'</div>'
    +'<button class="btn startb" onclick="lessonClose(this)">فهمت، ابدئي المهمة</button></div></div>'
    +'<div class="dots"><span class="on"></span><span></span></div></div>';
}
function showLesson(n){
  var h=$("dlgHost"); var o=document.createElement("div"); o.className="overlay lessonwrap"; o.innerHTML=lessonHTML(n); h.appendChild(o);
  iconize(o);
}
function lessonPane(btn,k){ var lc=btn.closest(".lc"); lc.classList.add("p2"); var d=lc.querySelectorAll(".dots span"); d[0].classList.remove("on"); d[1].classList.add("on"); }
function lessonClose(btn){ var o=btn.closest(".overlay"); if(o) o.remove(); if(S){ S.lesson=S.lesson||{}; S.lesson[S.cur]=true; save(); } }
function taskCard(n){
  var L=LESSONS[n];
  return '<div class="tc"><div class="tch"><span class="tcn">المهمة '+n+' من 6</span><h4>'+L.goal.replace('<br>',' ')+'</h4><button class="btn sm sec" onclick="showLesson('+n+')">'+lic("book",14)+' الشرح</button></div>'
    +'<div class="tcb"><ol class="steps2 compact">'+L.steps.map(function(s,i){return '<li><span class="n">'+(i+1)+'</span><div>'+s+'</div></li>';}).join("")+'</ol></div></div>';
}

var PAPERS=[["سجل الطالبات","torn"],["جدول المعلمات",""],["توزيع المواد","faded"],["درجات الفصل الأول","torn"],["قائمة الفصول",""],["جدول الحصص","faded"],["بيانات الطالبات — ثالث/2",""],["كشف المعلمات","torn"],["المواد والمعلمات","faded"]];
function buildScene(host,seed){
  var w=host.clientWidth||innerWidth, h=host.clientHeight||innerHeight, n=w<600?6:9, html='';
  for(var i=0;i<n;i++){ var p=PAPERS[i], x=(i*37+seed*13)%85, y=(i*53+seed*7)%80, r=((i*47)%50)-25, d=(6+(i%4)*1.5);
    if(x>26&&x<64){ x=x<45?Math.max(0,x-26):Math.min(85,x+24); }
    html+='<div class="paper '+p[1]+'" style="left:'+x+'%;top:'+y+'%;--r:'+r+'deg;--d:'+d+'s"><div class="ph">'+esc(p[0])+'</div><div class="pl"></div><div class="pl b"></div><div class="pl"></div><div class="pl b"></div><div class="pl"></div>'+(i%3===0?'<div class="stain"></div>':'')+(i%4===1?'<div class="x">✗</div>':'')+'</div>'; }
  host.innerHTML=html;
}
var END_SAMPLE={students:[{name:"نورة أحمد",cls:"ثالث/1"},{name:"سارة خالد",cls:"ثالث/1"},{name:"ريم فهد",cls:"ثالث/2"}],teachers:[{name:"منى سعد",spec:"رياضيات"},{name:"هند علي",spec:"علوم"}],subjects:[{sub:"رياضيات",tid:"1",g:"95"},{sub:"علوم",tid:"2",g:"88"}]};
function endTable(k,cols){
  var rows=(S.s2.rows[k]&&S.s2.rows[k].length)?S.s2.rows[k].slice(0,3):END_SAMPLE[k];
  var tn=S.s2.rows.teachers||[];
  return '<div class="tb"><div class="h">'+SCHEMA[k].title+'</div><table><tr><th>#</th>'+cols.map(function(c){return '<th>'+c[1]+'</th>';}).join("")+'</tr>'
    +rows.map(function(r,i){ return '<tr><td>'+(i+1)+'</td>'+cols.map(function(c){ var v=r[c[0]]; if(c[0]==="tid"){ var t=tn[+v-1]; v=t?String(t.name).replace(/^أ\.\s*/,"").split(/\s+/).slice(0,2).join(" "):v; } return '<td>'+esc(v)+'</td>'; }).join("")+'</tr>'; }).join("")+'</table></div>';
}
function endPhone(){
  var first=String(S.name).trim().split(/\s+/)[0];
  return '<div class="ip"><div class="ipscr"><div class="ipnotch"></div><div class="ipstat"><span class="ipclock">8:03</span><span>●●● ▲ ▮</span></div>'
    +'<div class="iptime"><b class="ipclock">8:03</b><small class="ipdate"></small></div>'
    +'<div class="ipnotif"><div class="nh"><span class="ic">42</span>'+esc(SCHOOL)+'<span class="now">الآن</span></div><span class="urg ok">تم إنجاز المهمة</span><div class="nt">رسالة من مديرة المدرسة</div>'
    +'<div class="nb">شكرًا يا <b>'+esc(first)+'</b>! رتبتِ كل شيء، وسجلات المدرسة عادت أفضل مما كانت. أنتِ الآن <b>خبيرة قواعد البيانات</b>.</div></div>'
    +'<div class="ipacts"><button class="gold" onclick="this.closest(\'.overlay\').remove();showCertificate()">'+ico("cert",22)+'استلام شهادتي</button></div>'
    +'<div class="iphome"></div></div></div><div class="endnote">تم توثيق إنجازك لدى معلمتك تلقائيًا ✓</div>';
}
function showEnding(){
  var h=$("dlgHost"); var o=document.createElement("div"); o.className="overlay endwrap";
  var ach=[["table","3 جداول"],["rel","علاقتان"],["query","استعلامان"],["form","نموذج"],["report","تقرير"]].map(function(a){return '<span>'+ico(a[0],15)+esc(a[1])+' <i>✓</i></span>';}).join("");
  o.innerHTML='<div class="scene" id="scene9"></div><div class="endv"><div class="endtab"><div class="endtag">✓ قاعدة بيانات المدرسة جاهزة</div>'
    +endTable("students",[["name","الاسم"],["cls","الفصل"]])+'<div class="con"><span>علاقة</span></div>'
    +endTable("subjects",[["sub","المادة"],["tid","المعلمة"],["g","الدرجة"]])+'<div class="con"><span>علاقة</span></div>'
    +endTable("teachers",[["name","الاسم"],["spec","التخصص"]])

/* ================= TEACHER ================= */
function teacherLogin(){
  dialog({title:"دخول المعلمة",icon:"🔒",html:'<label>رمز الدخول</label><input id="pin" type="password" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin-top:4px">',
    buttons:[{t:"دخول",f:function(){ if($("pin")&&$("pin").value===TEACHER_PIN) teacherView(); else dialog({text:"الرمز غير صحيح.",icon:"⛔"}); }},{t:"إلغاء",sec:true}]});
  setTimeout(function(){ var p=$("pin"); if(p) p.focus(); },50);
}
function teacherView(){
  var st=$("start"); st.innerHTML='<div class="card" style="max-width:960px"><h1>لوحة المعلمة</h1><p>تقدم الطالبات في المعمل</p><div class="row"><select id="tcls"><option value="">كل الفصول</option><option>ثالث/1</option><option>ثالث/2</option><option>ثالث/3</option><option>ثالث/4</option><option>ثالث/5</option><option>ثالث/6</option></select><button class="btn sm" onclick="teacherLoad()">🔄 تحديث</button><button class="btn sm sec" onclick="location.reload()">خروج</button></div><div id="tbody">جارٍ التحميل…</div></div>';
  $("tcls").onchange=teacherLoad; teacherLoad();
}
var TLIST=[];
function teacherCert(i){ var o=TLIST[i]; var str=o.name+o.cls+o.pts+6, h=0; for(var k=0;k<str.length;k++) h=(h*31+str.charCodeAt(k))>>>0; showCertificateFor({name:o.name,cls:o.cls,pts:o.pts,code:h.toString(36).toUpperCase().slice(-4)},false); }
function teacherLoad(){
  $("tbody").textContent="جارٍ التحميل…";
  fetchRows(function(rows){
    var f=$("tcls").value, m={};
    (rows||[]).forEach(function(r){ if(f&&r.cls!==f) return; var k=r.name+"|"+r.cls; var o=m[k]=m[k]||{name:r.name,cls:r.cls,st:{},pts:0,errs:0,last:"",dev:r.device};
      var s=+r.station; if(s>=1&&s<=6&&r.status==="مكتملة"){ if(!o.st[s]){ o.st[s]=true; o.pts+=+r.points||0; } o.errs+=+r.errors||0; }
      o.last=String(r.time||"").slice(0,16).replace("T"," "); });
    var list=Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name,"ar");});
    if(!list.length){ $("tbody").innerHTML='<p style="color:#888">لا توجد سجلات بعد.</p>'; return; }
    var stuck={}; list.forEach(function(o){ for(var i=1;i<=6;i++){ if(!o.st[i]){ stuck[i]=(stuck[i]||0)+1; break; } } });
    var html='<div class="wrap"><table class="tt"><tr><th>الطالبة</th><th>الفصل</th>'+STATIONS.map(function(s){return '<th title="'+s.name+'">'+s.n+'</th>';}).join("")+'<th>النقاط</th><th>الأخطاء</th><th>الجهاز</th><th>آخر نشاط</th><th>الشهادة</th></tr>';
    list.forEach(function(o,i){ var d=Object.keys(o.st).length; html+='<tr><td class="n">'+esc(o.name)+(d===6?' 🏅':'')+'</td><td>'+esc(o.cls)+'</td>'+STATIONS.map(function(s){return '<td class="'+(o.st[s.n]?'y':'x')+'">'+(o.st[s.n]?'✓':'—')+'</td>';}).join("")+'<td><b>'+o.pts+'</b></td><td>'+o.errs+'</td><td>'+esc(o.dev||"")+'</td><td style="font-size:12px">'+esc(o.last)+'</td><td>'+(d===6?'<button class="btn sm" onclick="teacherCert('+i+')">🎓 الشهادة</button>':'<span style="color:#bbb;font-size:12px">'+d+'/6</span>')+'</td></tr>'; });
    TLIST=list;
    html+='</table></div><p style="font-size:13px;color:#555;margin-top:10px">الطالبات: '+list.length+' — أنهين المعمل: '+list.filter(function(o){return Object.keys(o.st).length===6;}).length+' — أكثر محطة توقف عندها الطالبات: '+(Object.keys(stuck).length?STATIONS[(+Object.keys(stuck).sort(function(a,b){return stuck[b]-stuck[a];})[0])-1].name:"—")+'</p>';
    $("tbody").innerHTML=html;
  },function(){ $("tbody").innerHTML='<p style="color:#c00">تعذر جلب البيانات. تأكدي من الاتصال بالإنترنت، أو افتحي جدول Google مباشرة.</p>'; });
}

function teacherGate(){
  $("start").innerHTML='<div class="card"><h1>لوحة المعلمة</h1><p>قاعدة بيانات المدرسة — متابعة تقدم الطالبات</p><label>رمز الدخول</label><input id="pin" type="password" autocomplete="off"><button class="btn w" onclick="teacherCheck()">دخول</button></div>';
  $("pin").onkeydown=function(e){ if(e.key==="Enter") teacherCheck(); }; $("pin").focus();

function teacherCheck(){ if($("pin").value===TEACHER_PIN) teacherView(); else { markBad([$("pin")]); dialog({text:"الرمز غير صحيح.",icon:"⛔"}); } }
(function(){ if(window.TEACHER_MODE||/[?&]teacher/.test(location.search)) teacherGate(); })();
